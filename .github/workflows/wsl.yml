name: WSL browser checks

on:
  push:
    branches: [main, 'codex/**', '!codex/lecture-native-windows-diagnostic']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wsl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: WSL 3.x / engine ${{ matrix.wsl }}
    strategy:
      fail-fast: false
      matrix:
        wsl: [1, 2]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.5'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.22.2'
      - name: Build isolated npm artifact
        run: |
          node npm/build.mjs
          npm pack --ignore-scripts --pack-destination dist
      - name: Record WSL package version
        run: |
          $version = wsl.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'WSL package version could not be read.' }
          $version | ForEach-Object { $_.Replace([string][char]0, '') }
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364
        with:
          distribution: Ubuntu-24.04
          wsl-version: ${{ matrix.wsl }}
          additional-packages: curl ca-certificates xz-utils
      - name: Verify Linux installation and Windows browser authentication transport
        shell: wsl-bash {0}
        run: |
          set -eu
          package_url=https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
          curl --fail --silent --show-error --location "$package_url" -o /tmp/tum-node.tar.xz
          printf 'df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/tum-node.tar.xz\n' | sha256sum --check -
          mkdir -p /opt/tum-ci-node
          tar -xJf /tmp/tum-node.tar.xz -C /opt/tum-ci-node --strip-components=1
          export PATH="/opt/tum-ci-node/bin:$PATH"
          npm run test:consumer
          npm run test:upgrade
          npm run test:package-lifecycle
