name: Desktop checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 35 || 25 }}
    env:
      TUM_MCP_BROWSER_INTEGRATION: '1'
      TUM_MCP_STUDOCU_BROWSER_QA: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install macOS OCR dependency
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr gnome-keyring dbus-x11
      - name: Install Windows OCR dependency
        if: runner.os == 'Windows'
        run: |
          choco install tesseract --no-progress -y
          "$env:ProgramFiles\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install locked Python dependencies
        run: uv sync --locked
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
      - name: Verify optional native lecture recognition
        env:
          TUM_MCP_LECTURE_ASR_INTEGRATION: '1'
        run: uv run pytest -v tests/integration/test_lecture_runtime_native.py --tb=short
      - name: Check Windows browser and UTF-8 fixture regressions
        if: runner.os == 'Windows'
        run: >-
          uv run pytest -x -v
          tests/integration/test_exercise_browser.py::test_static_exercises_under_a_project_prefix
          tests/integration/test_lecture_publish.py::test_lecture_referencing_studocu_is_excluded_or_denied
          tests/integration/test_studocu_import.py::test_alias_works_in_study_exercises_and_handbook_without_exporting_private_content
          tests/integration/test_studocu_publication.py
          --tb=short
      - name: Build and inspect campus npm artifact
        run: |
          node npm/build.mjs
          npm test
          npm pack --ignore-scripts --pack-destination dist
      - name: Verify single-command npm updates and removal
        run: npm run test:package-lifecycle
      - name: Verify clean campus consumer installation and MCP
        run: npm run test:consumer
      - name: Verify updates and removal from public releases
        run: npm run test:upgrade
      - name: Lint and format
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Test on macOS and Windows
        if: runner.os != 'Linux'
        env:
          TUM_MOODLE_SYSTEM_KEYRING: "1"
        run: uv run pytest -v --tb=short --durations=20 -o faulthandler_timeout=60
      - name: Test in a Linux desktop keyring session
        if: runner.os == 'Linux'
        env:
          TUM_MOODLE_SYSTEM_KEYRING: "1"
        run: |
          dbus-run-session -- sh -e -c '
            printf "ci-test-only" | gnome-keyring-daemon --unlock --components=secrets
            uv run pytest -v --tb=short --durations=20 -o faulthandler_timeout=60
          '
      - name: Build Python distribution
        run: uv build
