name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install OCR dependency
        run: brew install tesseract
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check src tests plugin/scripts scripts
          uv run ruff format --check src tests plugin/scripts scripts
      - name: Build plugin and private runtime
        run: |
          uv run python scripts/package_plugin.py
          uv run python dist/tum-moodle/scripts/bootstrap.py
      - name: Test without Moodle credentials
        env:
          TUM_MOODLE_PACKAGED: ${{ github.workspace }}/dist/tum-moodle/scripts/launch.py
        run: uv run pytest -q
      - name: Build Python distribution
        run: uv build
