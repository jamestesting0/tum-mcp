name: Desktop checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source tests (${{ matrix.os }})
    # Own codex/** branches are already checked by their exact-commit push run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !startsWith(github.head_ref, 'codex/')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 20 }}
    env:
      TUM_MCP_BROWSER_INTEGRATION: '1'
      TUM_MCP_STUDY_BROWSER_JOURNEYS: 'primary'
      TUM_MOODLE_SYSTEM_KEYRING: '1'
      TUM_MCP_LECTURE_ASR_INTEGRATION: '1'
      TUM_MCP_VIDEO_RENDER_INTEGRATION: '1'
      TUM_MCP_LECTURE_CUDA_LIBRARIES: ${{ matrix.os != 'macos-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install macOS OCR and video render dependencies
        if: runner.os == 'macOS'
        run: brew install tesseract cairo
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr gnome-keyring dbus-x11 libcairo2-dev libpango1.0-dev
      - name: Install Windows OCR dependency
        if: runner.os == 'Windows'
        run: |
          choco install tesseract --no-progress -y
          "$env:ProgramFiles\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: Lint and format
        if: runner.os == 'Linux'
        run: |
          uv run ruff check src tests scripts skill-lab
          uv run ruff format --check src tests scripts skill-lab
      # Native recognition, CUDA libraries and video rendering run inside the parallel suite.
      - name: Test on macOS and Windows
        if: runner.os != 'Linux'
        run: >-
          uv run pytest -v --tb=short --durations=20 -o faulthandler_timeout=120
          -n logical --dist loadfile
          --deselect=tests/integration/test_study_browser.py::test_study_website_journeys_pass_in_the_checkout
      - name: Test in a Linux desktop keyring session
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -e -c '
            printf "ci-test-only" | gnome-keyring-daemon --unlock --components=secrets
            uv run pytest -v --tb=short --durations=20 -o faulthandler_timeout=120 -n logical --dist loadfile
          '
      - name: Build Python distribution
        run: uv build

  installed:
    name: Installed package (${{ matrix.os }})
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !startsWith(github.head_ref, 'codex/')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 20 }}
    env:
      TUM_MCP_BROWSER_INTEGRATION: '1'
      TUM_MCP_STUDY_BROWSER_JOURNEYS: 'primary'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
      - name: Build and inspect campus npm artifact
        run: |
          node npm/build.mjs
          npm test
          npm pack --ignore-scripts --pack-destination dist
      - name: Verify single-command npm updates and removal
        run: npm run test:package-lifecycle
      - name: Verify clean campus consumer installation and MCP
        run: npm run test:consumer
      - name: Verify updates from 0.9.0 and safe removal
        run: npm run test:upgrade
