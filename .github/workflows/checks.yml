name: Desktop checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TUM_MOODLE_INSTALLER_INTEGRATION: "1"
      TUM_MOODLE_INSTALLER_EVIDENCE: ${{ github.workspace }}/.omo/evidence/installer-benchmark.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install macOS OCR dependency
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr gnome-keyring dbus-x11
      - name: Install Windows OCR dependency
        if: runner.os == 'Windows'
        run: |
          choco install tesseract --no-progress -y
          "$env:ProgramFiles\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install locked Python dependencies
        run: uv sync --locked
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
      - name: Build and inspect campus npm artifact
        run: |
          node npm/build.mjs
          npm test
          npm pack --ignore-scripts --pack-destination dist
      - name: Verify clean campus consumer installation and MCP
        run: npm run test:consumer -- dist/jamestesting888-tum-mcp-0.5.0.tgz
      - name: Lint and format
        run: |
          uv run ruff check src tests plugin/scripts scripts
          uv run ruff format --check src tests plugin/scripts scripts
      - name: Build plugin
        run: uv run python scripts/package_plugin.py
      - name: Build private runtime on macOS and Windows
        if: runner.os != 'Linux'
        run: uv run python dist/tum-moodle/scripts/bootstrap.py
      - name: Build private runtime in Linux keyring session
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -e -c '
            printf "ci-test-only" | gnome-keyring-daemon --unlock --components=secrets
            uv run python dist/tum-moodle/scripts/bootstrap.py
          '
      - name: Test on macOS and Windows
        if: runner.os != 'Linux'
        env:
          TUM_MOODLE_PACKAGED: ${{ github.workspace }}/dist/tum-moodle/scripts/launch.py
          TUM_MOODLE_SYSTEM_KEYRING: "1"
        run: uv run pytest -q
      - name: Test in a Linux desktop keyring session
        if: runner.os == 'Linux'
        env:
          TUM_MOODLE_PACKAGED: ${{ github.workspace }}/dist/tum-moodle/scripts/launch.py
          TUM_MOODLE_SYSTEM_KEYRING: "1"
        run: |
          dbus-run-session -- sh -e -c '
            printf "ci-test-only" | gnome-keyring-daemon --unlock --components=secrets
            uv run pytest -q
          '
      - name: Build Python distribution
        run: uv build
      - name: Installer timing summary
        run: uv run python -c "import os; from pathlib import Path; print(Path(os.environ['TUM_MOODLE_INSTALLER_EVIDENCE']).read_text())"
